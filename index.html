<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ôn Tập Trắc Nghiệm — Phương Pháp Nghiên Cứu Khoa Học (107 Câu)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-badge" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
            <path d="M6 12v5c3 3 9 3 12 0v-5" />
          </svg>
        </div>
        <h1 class="brand-title">Ôn Tập PPNCTCN</h1>
      </div>

      <nav class="mode-tabs" aria-label="Chế độ học tập">
        <button type="button" class="tab-btn is-active" data-mode="practice" aria-current="page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
          </svg>
          <span>Ôn luyện</span>
        </button>
        <button type="button" class="tab-btn" data-mode="exam">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          <span>Thi thử</span>
        </button>
        <button type="button" class="tab-btn" data-mode="bank">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <span class="label-desktop">Ngân hàng 107 câu</span>
          <span class="label-mobile">Tra cứu</span>
        </button>
      </nav>

      <div class="topbar-actions">
        <div class="mastery-pill" title="Số câu đã trả lời đúng trong mục Ôn luyện">
          <span class="mastery-dot" aria-hidden="true"></span>
          <span id="masteryText" class="tabular-nums">0/107 đã thuộc</span>
        </div>
        <button type="button" id="themeToggle" class="icon-btn" aria-label="Đổi giao diện Sáng hoặc Tối" title="Đổi giao diện Sáng / Tối">
          <svg id="themeIconMoon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
          <svg id="themeIconSun" class="hidden" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="appRoot" class="app-container"></main>

  <!-- Modal Zoom Ảnh Gốc -->
  <div id="imageModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-label="Phóng to ảnh tài liệu gốc">
    <div class="modal-card">
      <div class="modal-header">
        <span id="imageModalTitle" class="modal-title">Ảnh chụp từ tài liệu gốc (.docx)</span>
        <button type="button" id="closeImageModal" class="icon-btn" aria-label="Đóng ảnh phóng to">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <img id="imageModalImg" src="" alt="Ảnh câu hỏi gốc" />
      </div>
    </div>
  </div>

  <!-- Mobile Question Navigator Modal -->
  <div id="navModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-label="Bản đồ câu hỏi">
    <div class="modal-card modal-sheet">
      <div class="modal-header">
        <span class="modal-title">Chọn câu hỏi nhanh</span>
        <button type="button" id="closeNavModal" class="icon-btn" aria-label="Đóng bản đồ câu hỏi">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div id="navModalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="data/questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
